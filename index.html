<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cormorant:wght@300&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #FFFCF6;
  font-family: 'Cormorant', serif;
}

/* HERO */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ВИДЕО В HERO */
.hero video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* ТЕКСТ */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.logo {
  font-size: 60px;
  font-family: 'Playfair Display';
}

.quote {
  font-size: 14px;
  max-width: 280px;
}

/* СЕКЦИИ */
..section {
  padding: 10px 10px;
}
  text-align: center;
}

/* ГАЛЕРЕЯ */
.gallery {
  display: flex;
  overflow-x: auto;
  gap: 10px;
}
img {
  width: 100%;
  display: block;
}
}

/* HAND */
.hand {
  position: relative;
}
.hand img {
  width: 100%;
}

/* ТАЙМЕР */
.timer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  display: flex;
  gap: 15px;
  font-size: 24px;
}

/* АНКЕТА */
input {
  width: 80%;
  padding: 12px;
  margin: 8px;
}

button {
  padding: 12px 25px;
  background: #2d4f73;
  color: white;
  border: none;
}
</style>
</head>

<body>

<!-- 🎬 ПЕРВЫЙ ЭКРАН -->
<section class="hero" id="hero">

  <video autoplay muted loop playsinline webkit-playsinline preload="auto">
  <source src="fabric.mov" type="video/mp4">
</video>

  <div class="center">
    <div class="logo">A | V</div>
    <div class="quote">
      «Так что они уже не двое, но одна плоть...»
    </div>
  </div>

</section>

<!-- 🎵 -->
<audio id="music" src="music.mp3"></audio>

<!-- ФОТО -->
<div class="section"><img src="Photo1.jpg"></div>
<div class="section"><img src="Photo2.jpg"></div>
<div class="section"><img src="Photo3.PNG"></div>
<div class="section"><img src="Photo4.PNG"></div>

<!-- ГАЛЕРЕЯ -->
<div class="gallery">
  <img src="P1.JPG">
  <img src="P2.JPG">
  <img src="P3.JPG">
  <img src="P4.JPG">
</div>

<!-- HAND -->
<div class="hand">
  <img src="Hand.jpg">
  <div class="timer" id="timer"></div>
</div>

<!-- АНКЕТА -->
<div class="section">
  <h2>Анкета гостя</h2>

  <input id="name" placeholder="Имя">

  <div>
    <label><input type="radio" name="go" value="Да"> Да</label>
    <label><input type="radio" name="go" value="Нет"> Нет</label>
  </div>

  <input id="count" placeholder="Количество">

  <button onclick="send()">Отправить</button>

  <p onclick="window.open('https://t.me/+s59jP9LBAQQzNmE6')">
    Перейти в Telegram
  </p>
</div>

<script>

/* МУЗЫКА */
document.getElementById("hero").onclick = () => {
  let music = document.getElementById("music");
  music.currentTime = 11;
  music.play();
}

/* ТАЙМЕР */
let end = new Date("May 23, 2026 11:00:00").getTime();

setInterval(()=>{
  let now = new Date().getTime();
  let d = Math.floor((end-now)/(1000*60*60*24));
  let h = Math.floor((end-now)/(1000*60*60)%24);
  let m = Math.floor((end-now)/(1000*60)%60);
  let s = Math.floor((end-now)/1000%60);

  document.getElementById("timer").innerHTML =
  `${d} | ${h} | ${m} | ${s}`;
},1000);

/* TELEGRAM */
function send(){
fetch(`https://api.telegram.org/bot8516218775:AAFz39TECTa2LTRbWymgGjWJ6nu5n308VXM/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:"1808023543",
text:"Новая анкета"
})
});
alert("Спасибо 💛");
}

</script>

</body>
</html>
