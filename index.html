<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Свадьба</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cormorant:wght@300&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #FFFCF6;
  font-family: 'Cormorant', serif;
  overflow-x: hidden;
}

/* ТКАНЬ */
.fabric {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.28;
  z-index: -1;
  pointer-events: none;
  animation: fabricMove 12s ease-in-out infinite;
}

@keyframes fabricMove {
  0% { transform: scale(1) translateY(0px); }
  50% { transform: scale(1.04) translateY(-12px); }
  100% { transform: scale(1) translateY(0px); }
}

/* ПЕРВЫЙ ЭКРАН */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
  text-align: center;
  transition: 1s;
}

.logo {
  font-size: 64px;
  font-family: 'Playfair Display', serif;
}

.quote {
  max-width: 320px;
  font-size: 15px;
  line-height: 1.5;
}

/* СКРЫТИЕ */
.hidden {
  opacity: 0;
  pointer-events: none;
}

/* СЕКЦИИ */
.section {
  padding: 25px 15px;
  text-align: center;
  opacity: 0;
  transform: translateY(25px);
  transition: 0.8s;
}

.section.show {
  opacity: 1;
  transform: translateY(0);
}

.section img {
  width: 100%;
  border-radius: 18px;
}

/* ГАЛЕРЕЯ */
.gallery {
  display: flex;
  overflow-x: auto;
  gap: 12px;
  padding: 10px;
}
.gallery img {
  width: 70%;
  border-radius: 15px;
}

/* HAND + TIMER */
.hand-block {
  position: relative;
}

.hand-block img {
  width: 100%;
}

/* ТАЙМЕР */
.timer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  display: flex;
  gap: 18px;

  font-family: 'Playfair Display', serif;
  font-size: 26px;
}

.timer div {
  text-align: center;
}

.timer span {
  display: block;
  font-size: 11px;
  margin-top: 4px;
}
</style>
</head>

<body>

<!-- ТКАНЬ -->
<video class="fabric" autoplay muted loop playsinline preload="auto">
  <source src="fabric.mp4" type="video/mp4">
</video>

<!-- МУЗЫКА -->
<audio id="music" src="music.mp3"></audio>

<!-- ПЕРВЫЙ ЭКРАН -->
<section class="hero" id="hero">
  <div class="logo">A | V</div>
  <div class="quote">
    «Так что они уже не двое, но одна плоть.<br>
    Итак, что Бог сочетал, того человек да не разлучает»<br><br>
    (Матфея 19:6)
  </div>
</section>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div id="content">

<section class="section"><img src="Photo1.jpg"></section>
<section class="section"><img src="Photo2.jpg"></section>
<section class="section"><img src="Photo3.PNG"></section>
<section class="section"><img src="Photo4.PNG"></section>

<!-- ГАЛЕРЕЯ -->
<section class="section">
  <div class="gallery">
    <img src="P1.JPG">
    <img src="P2.JPG">
    <img src="P3.JPG">
    <img src="P4.JPG">
  </div>
</section>

<section class="section"><img src="Photo5.jpg"></section>

<!-- ТАЙМЕР -->
<section class="section">
  <div class="hand-block">
    <img src="Hand.jpg">
    <div class="timer" id="timer"></div>
  </div>
</section>

</div>

<script>

/* КЛИК → СТАРТ */
document.getElementById("hero").addEventListener("click", () => {
  document.getElementById("hero").classList.add("hidden");

  let music = document.getElementById("music");
  music.currentTime = 11;
  music.play();
});

/* СКРОЛЛ */
const sections = document.querySelectorAll('.section');

window.addEventListener('scroll', () => {
  sections.forEach(sec => {
    if (sec.getBoundingClientRect().top < window.innerHeight - 80) {
      sec.classList.add('show');
    }
  });
});

/* ТАЙМЕР */
let endDate = new Date("May 23, 2026 11:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let diff = endDate - now;

  let d = Math.floor(diff / (1000*60*60*24));
  let h = Math.floor((diff / (1000*60*60)) % 24);
  let m = Math.floor((diff / (1000*60)) % 60);
  let s = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerHTML = `
    <div>${d}<span>дней</span></div>
    <div>${h}<span>часов</span></div>
    <div>${m}<span>минут</span></div>
    <div>${s}<span>секунд</span></div>
  `;
}, 1000);

</script>

</body>
</html>
